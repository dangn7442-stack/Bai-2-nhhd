<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Jackson Electronics - Registration Form</title>
    <style>
        body {
            background-color: #9ac2ff;
            font-family: "Times New Roman", Times, serif;
            color: #000;
            margin: 0;
            padding: 20px;
        }

        .logo-box {
            background-color: #00ffff;
            border: 2px solid #000;
            box-shadow: 4px 4px 0px #666;
            text-align: center;
            padding: 5px 20px;
            font-weight: bold;
            font-size: 24px;
            width: 300px;
        }

        .logo-line {
            border-top: 2px solid #000;
            margin: 2px 0;
        }

        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 28px;
            margin: 15px 0 5px 0;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            font-size: 15px;
            margin: 0 0 15px 0;
        }

        input[type="text"], select, textarea {
            border: 1px solid #7f9db9;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 13px;
            padding: 2px;
        }

        input[type="button"], input[type="submit"], input[type="reset"] {
            font-family: Arial, sans-serif;
            font-size: 12px;
            background-color: #e0e0e0;
            border: 2px outset #ffffff;
            padding: 2px 8px;
            cursor: pointer;
        }

        input[type="button"]:active {
            border-style: inset;
        }

        hr {
            border: 0;
            border-top: 1px solid #666;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <table border="0" align="center" cellpadding="0" cellspacing="0" width="600">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" class="logo-box">
                    <tr>
                        <td align="center">
                            Jackson
                            <div class="logo-line"></div>
                            Electronics
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td align="center">
                <h1>Registration Form</h1>
                <p class="subtitle">Register your Jackson Electronics product here</p>
            </td>
        </tr>
        <tr>
            <td>
                <form action="#" method="post">
                    <table border="0" cellpadding="3" cellspacing="0" width="100%">
                        <tr>
                            <td width="120" align="left">First Name:</td>
                            <td>
                                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                    <tr>
                                        <td><input type="text" name="firstName" style="width: 140px;"></td>
                                        <td align="right" width="80">Last Name:</td>
                                        <td align="right" width="110"><input type="text" name="lastName" style="width: 100px;"></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td>Address #1:</td>
                            <td><input type="text" name="address1" style="width: 250px;"></td>
                        </tr>
                        <tr>
                            <td>Address #2:</td>
                            <td><input type="text" name="address2" style="width: 250px;"></td>
                        </tr>
                        <tr>
                            <td>City:</td>
                            <td>
                                <table border="0" cellpadding="0" cellspacing="0">
                                    <tr>
                                        <td><input type="text" name="city" style="width: 170px;"></td>
                                        <td style="padding-left: 10px;">State:</td>
                                        <td style="padding-left: 5px;"><input type="text" name="state" style="width: 40px;"></td>
                                        <td style="padding-left: 10px;">Zip:</td>
                                        <td style="padding-left: 5px;"><input type="text" name="zip" style="width: 70px;"></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td>Country:</td>
                            <td><input type="text" name="country" value="United States" style="width: 170px;"></td>
                        </tr>
                        <tr>
                            <td colspan="2"><hr></td>
                        </tr>
                        <tr>
                            <td>Product:</td>
                            <td>
                                <select name="product" style="width: 130px;">
                                    <option value="ScanMaster">ScanMaster</option>
                                    <option value="LaserPrinter">LaserPrinter</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>Date Purchased:</td>
                            <td><input type="text" name="datePurchased" style="width: 170px;"></td>
                        </tr>
                        <tr>
                            <td>Serial #:</td>
                            <td><input type="text" name="serialNumber" style="width: 170px;"></td>
                        </tr>
                        <tr>
                            <td valign="top">Used for:</td>
                            <td>
                                <table border="0" cellpadding="1" cellspacing="0">
                                    <tr>
                                        <td width="160"><label><input type="radio" name="usedFor" value="Home"> Home</label></td>
                                        <td><label><input type="radio" name="usedFor" value="Educational Institution"> Educational Institution</label></td>
                                    </tr>
                                    <tr>
                                        <td><label><input type="radio" name="usedFor" value="Business" checked> Business</label></td>
                                        <td><label><input type="radio" name="usedFor" value="Other"> Other</label></td>
                                    </tr>
                                    <tr>
                                        <td colspan="2"><label><input type="radio" name="usedFor" value="Government"> Government</label></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td valign="top">System (check all that apply):</td>
                            <td>
                                <table border="0" cellpadding="1" cellspacing="0">
                                    <tr>
                                        <td width="160"><label><input type="checkbox" name="system" value="Windows"> Windows</label></td>
                                        <td><label><input type="checkbox" name="system" value="UNIX"> UNIX</label></td>
                                    </tr>
                                    <tr>
                                        <td><label><input type="checkbox" name="system" value="Macintosh"> Macintosh</label></td>
                                        <td><label><input type="checkbox" name="system" value="Other"> Other</label></td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2"><hr></td>
                        </tr>
                        <tr>
                            <td valign="top">Comments?:</td>
                            <td>
                                <textarea name="comments" rows="5" style="width: 100%; box-sizing: border-box;"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center" style="padding-top: 15px;">
                                <input type="submit" value="Click to register">
                                &nbsp;&nbsp;
                                <input type="reset" value="Click to cancel">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
